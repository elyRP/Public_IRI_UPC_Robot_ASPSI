AkpLocalPlanner:
  move_base: True
  plan_mode: 2
  distance_mode: 1
  global_mode: 3
  vis_mode:    1
  frozen_mode: False
  number_vertex: 500
  horizon_time: 5.0
  cost_distance:    0.7
  cost_orientation: 0.5
  cost_w_robot:     0.4
  cost_w_people:    0.2
  cost_time:        0.25
  cost_obs:         0.2
  cost_old_path:    0.4
  cost_l_minima:    0.0
  v_max:  1.0
  w_max:  0.7
  av_max: 0.2
  av_max_neg: 0.3
  av_break: 0.2
  aw_max: 0.8
  platform_radii: 0.5
  xy_goal_tolerance: 0.3
  distance_to_stop: 2.0
  v_goal_tolerance: 0.1
  esfm_to_person_A: 3.5
  esfm_to_person_B: 0.81
  esfm_to_person_lambda: 0.25
  esfm_to_robot_A: 3.5
  esfm_to_robot_B: 0.81
  esfm_to_robot_lambda: 0.25
  esfm_to_obstacle_A: 3.5
  esfm_to_obstacle_B: 0.78
  esfm_to_obstacle_lambda: 1.0
  esfm_k: 1.52
  esfm_d: 0.2
  min_v_to_predict : 0.1
  ppl_collision_mode : 0
  pr_force_mode : 0
  goal_providing_mode : 1
  slicing_diff_orientation : 50.0
  esfm_to_person_companion_A: 10.0252
  esfm_to_person_companion_B: 0.4  
  esfm_to_person_companion_lambda: 1.0
  esfm_companion_d: 0.1
  genome_Cr: 0.62
  genome_Ct: 0.08
  genome_eta: -0.43
  genome_r0: 1.0
  genome_S0: 0.5
  genome_rmax: 3
